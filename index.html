<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/public/favicon.svg" />
  <title>Play LooP</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&display=swap" rel="stylesheet" />
</head>

<body class="h-dvh bg-black text-white">
  <!-- layout -->
  <div class="flex h-dvh flex-col overflow-hidden">
    <!-- navigation bar -->
    <header class="relative z-30 w-full shrink-0 border-b border-zinc-800 bg-black">
      <nav class="relative flex items-center justify-between px-5 py-3">
        <div class="flex items-center gap-3">
          <div class="sidebar-controls" aria-live="polite">
            <button type="button" class="sidebar-control toggle-sidebar" data-action="toggle-sidebar"
              aria-label="Open menu" aria-expanded="false">
              <i data-lucide="menu" class="w-7 h-7"></i>
            </button>
            <button type="button" class="sidebar-control close-sidebar is-hidden" data-action="close-sidebar"
              aria-label="Close menu" aria-expanded="true" tabindex="-1">
              <i data-lucide="x" class="w-7 h-7"></i>
            </button>
          </div>
              <h1 class="header-title text-2xl font-bold"><a class="brand-link" href="/" data-nav="home"><img
                class="brand-logo" src="public/logo.svg" alt="Play LooP logo" />Play LooP</a></h1>
        </div>
        <div class="header-actions flex items-center gap-3">
          <form class="search-form" data-search-form role="search">
            <input class="search-input" type="search" name="search" autocomplete="off" autocorrect="off"
              autocapitalize="none" spellcheck="false" inputmode="search"
              placeholder="What do you want to play?" aria-label="Search music" />
            <button type="button" class="clear-search is-hidden" data-action="clear-search" aria-label="Clear search">
              <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            <button type="button" class="search-button" data-action="search-toggle" aria-label="Open search">
              <i data-lucide="search" class="w-6 h-6"></i>
            </button>
          </form>
          <button type="button" class="profile-button" data-action="profile-button" aria-label="Profile">
            <i data-lucide="user" class="w-6 h-6"></i>
          </button>
        </div>
      </nav>
    </header>

    <main class="relative flex min-h-0 flex-1">
      <!-- sidebar -->
      <aside
        class="sidebar is-closed w-70 bg-black border-r flex flex-col overflow-y-auto border-zinc-800 text-white p-5 "
        data-sidebar>
        <nav class="mt-1">
          <ul class=" border-b border-zinc-800 ">
            <li class="mb-5 border-white"><a href="/" class="underline-link" data-nav="home"><i data-lucide="home"
                  class="w-6 h-6"></i><span>Home</span></a></li>
            <li class="mb-5"><a href="#search" class="underline-link" data-nav="search"><i data-lucide="search" class="w-6
                    h-6"></i><span>Search</span></a></li>
            <li class="mb-5"><a href="#library" class="underline-link" data-nav="library"><i data-lucide="library"
                  class="w-6 h-6"></i><span>Your
                  Library</span></a></li>
            <li class="mb-5"><a href="#Download" class="underline-link" data-nav="Download"><i data-lucide="download"
                  class="w-6 h-6"></i><span>Download App</span></a></li>

          </ul>
          <ul class="mt-5">
            <li class="mb-5"><a href="#create-playlist" class="underline-link" data-nav="create-playlist"><i
                  data-lucide="plus-square" class="w-6 h-6"></i><span>Create Playlist</span></a></li>
            <li class="mb-5"><a href="#liked-songs" class="underline-link" data-nav="liked-songs"><i data-lucide="heart"
                  class="w-6 h-6"></i><span>Liked
                  Songs</span></a></li>
          </ul>
        </nav>
        <ul class="mt-5 border-t border-zinc-800 pt-5 sidebar-bottom">
          <li class="mb-5"><a href="#logout" class="underline-link" data-nav="logout"><i data-lucide="log-out"
                class="w-6 h-6"></i><span>Logout</span></a></li>
          <li class="mb-5"><a href="#settings" class="underline-link" data-nav="settings"><i data-lucide="settings"
                class="w-6 h-6"></i><span>Settings</span></a></li>
        </ul>
      </aside>
      <section class="app-content" data-content aria-live="polite"></section>
    </main>
  </div>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
  <script src="pages.js"></script>
  <script src="script.js"></script>
</body>

</html>
